name: ci

on:
  push:
  pull_request:

env:
  WASI_SDK_URL: https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz
  WASI_SDK_SHA256: c6c38aab56e5de88adf6c1ebc9c3ae8da72f88ec2b656fb024eda8d4167a0bc5
  WAMR_COMMIT: 47c7c85ac21f240a878026af603e032065d183fb   # tag WAMR-2.4.0
  XTENSA_LLVM_COMMIT: 344b928e67bfc1d07cb150609c55548e86a9bf19  # espressif/llvm-project, branch xtensa_release_18.1.2
  TOOLCHAIN_ROOT: ${{ github.workspace }}/.toolchain
  # Prebuilt wamrc asset (toolchain-v1 release, built by toolchain.yml from
  # the same pins). "pending" until the release lands: the asset tier then
  # skips itself and CI falls back to the source build below.
  WAMRC_ASSET_URL: https://github.com/wan-cloud/xuansi-drivers/releases/download/toolchain-v1/wamrc-2.4.0-xtensa-18.1.2-linux-x64.tar.gz
  WAMRC_MANIFEST_URL: https://github.com/wan-cloud/xuansi-drivers/releases/download/toolchain-v1/manifest.json
  WAMRC_ASSET_SHA256: be6ca10431a03adfe0577c5993addbe6540e9580af2fe56096a3282e0d1a3ac5

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: wasi-sdk 24.0 (download, verify, extract)
        run: |
          mkdir -p "$TOOLCHAIN_ROOT"
          curl -fsSL "$WASI_SDK_URL" -o "$TOOLCHAIN_ROOT/wasi-sdk.tar.gz"
          echo "$WASI_SDK_SHA256  $TOOLCHAIN_ROOT/wasi-sdk.tar.gz" | sha256sum -c -
          tar -xzf "$TOOLCHAIN_ROOT/wasi-sdk.tar.gz" -C "$TOOLCHAIN_ROOT"
          test -x "$TOOLCHAIN_ROOT/wasi-sdk-24.0-x86_64-linux/bin/clang"

      - name: wamrc binary (cache)
        id: wamrc-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN_ROOT }}/wamrc-install
          key: wamrc-WAMR-2.4.0-xtensa-18.1.2-v2

      # Asset tier: the toolchain-v1 release carries a wamrc built from
      # exactly these pins (toolchain.yml). Verified two ways — the
      # tarball's sha256 against the WAMRC_ASSET_SHA256 literal, and the
      # release manifest's source SHAs against this workflow's pins —
      # then the xtensa backend is asserted before use. Any failure
      # (absent release, hash drift, pin mismatch) falls through to the
      # source build below.
      - name: wamrc from the toolchain-v1 release asset
        id: wamrc-asset
        if: env.WAMRC_ASSET_SHA256 != 'pending' && steps.wamrc-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -eux
          mkdir -p "$TOOLCHAIN_ROOT/wamrc-install"
          curl -fsSL "$WAMRC_ASSET_URL" -o "$TOOLCHAIN_ROOT/wamrc-asset.tar.gz"
          echo "$WAMRC_ASSET_SHA256  $TOOLCHAIN_ROOT/wamrc-asset.tar.gz" | sha256sum -c -
          curl -fsSL "$WAMRC_MANIFEST_URL" -o "$TOOLCHAIN_ROOT/wamrc-manifest.json"
          python3 - "$TOOLCHAIN_ROOT/wamrc-manifest.json" <<'EOF'
          import json, os, sys
          m = json.load(open(sys.argv[1]))
          pins = {
              "esp_llvm_sha": os.environ["XTENSA_LLVM_COMMIT"],
              "wamr_sha": os.environ["WAMR_COMMIT"],
              "wasi_sdk_tarball_sha256": os.environ["WASI_SDK_SHA256"],
          }
          for k, want in pins.items():
              got = m.get(k)
              if got != want:
                  sys.exit(f"toolchain-v1 manifest {k}={got} != this workflow's pin {want}")
          print("manifest pins match")
          EOF
          tar -xzf "$TOOLCHAIN_ROOT/wamrc-asset.tar.gz" -C "$TOOLCHAIN_ROOT/wamrc-install"
          # wamrc --target=help exits 1 by design — swallow it, grep decides
          targets="$("$TOOLCHAIN_ROOT/wamrc-install/wamrc" --target=help 2>&1 || true)"
          echo "$targets" | grep -q "xtensa"
          echo "wamrc asset tier: OK (LLVM source build skipped)"

      # Prebuilt wamrc releases lack the xtensa backend, so it is built
      # from source once per cache key (~1h): WAMR-2.4.0 with the
      # espressif/llvm-project xtensa_release_18.1.2 LLVM, then
      # wamr-compiler linked against it. Same recipe as the frozen local
      # toolchain (see README "Toolchain"). NOTE: the espressif fork
      # registers Xtensa as an EXPERIMENTAL target — it must be pulled in
      # via LLVM_EXPERIMENTAL_TARGETS_TO_BUILD (adding it to
      # LLVM_TARGETS_TO_BUILD fatals: not in LLVM_ALL_TARGETS).
      - name: build wamrc from pinned sources (cache/asset miss only)
        if: steps.wamrc-cache.outputs.cache-hit != 'true' && steps.wamrc-asset.outcome != 'success'
        run: |
          set -eux
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build ccache
          git init wamr
          git -C wamr remote add origin https://github.com/bytecodealliance/wasm-micro-runtime.git
          git -C wamr fetch --depth 1 origin "$WAMR_COMMIT"
          git -C wamr checkout FETCH_HEAD
          git init wamr/core/deps/llvm
          git -C wamr/core/deps/llvm remote add origin https://github.com/espressif/llvm-project.git
          git -C wamr/core/deps/llvm fetch --depth 1 origin "$XTENSA_LLVM_COMMIT"
          git -C wamr/core/deps/llvm checkout FETCH_HEAD
          cmake -G Ninja -S wamr/core/deps/llvm/llvm -B wamr/core/deps/llvm/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD="AArch64;ARM;Mips;RISCV;X86" \
            -DLLVM_EXPERIMENTAL_TARGETS_TO_BUILD=Xtensa \
            -DCMAKE_CXX_FLAGS="-include cstdint" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ninja -C wamr/core/deps/llvm/build
          cmake -G Ninja -S wamr/wamr-compiler -B wamr/wamr-compiler/build \
            -DCMAKE_BUILD_TYPE= \
            -DCMAKE_CXX_FLAGS="-include cstdint" \
            -DLLVM_DIR="$PWD/wamr/core/deps/llvm/build/lib/cmake/llvm"
          cmake --build wamr/wamr-compiler/build -j"$(nproc)"
          mkdir -p "$TOOLCHAIN_ROOT/wamrc-install"
          cp wamr/wamr-compiler/build/wamrc "$TOOLCHAIN_ROOT/wamrc-install/wamrc"
          # wamrc --target=help exits 1 by design — swallow it, grep decides
          targets="$("$TOOLCHAIN_ROOT/wamrc-install/wamrc" --target=help 2>&1 || true)"
          echo "$targets"
          echo "$targets" | grep -q "xtensa" || { echo "wamrc lacks the xtensa backend" >&2; exit 1; }

      - name: build all modules
        run: |
          export WASI_SDK="$TOOLCHAIN_ROOT/wasi-sdk-24.0-x86_64-linux"
          export WAMRC="$TOOLCHAIN_ROOT/wamrc-install/wamrc"
          ./build.sh

      - name: deliverable artifacts match the committed ones (hard gate; .aot advisory)
        run: |
          # Deliverables (.wasm, what index.json files[] lists) must be
          # byte-identical. The auxiliary .aot depends on the wamrc build
          # environment; its committed hash is provenance recorded in
          # meta.json and verified advisory (cross-wamrc-build byte
          # determinism is not asserted).
          if ! git diff --quiet -- modules/ ':(exclude)*.aot'; then
            git diff --stat -- modules/ ':(exclude)*.aot'
            echo "ERROR: freshly built deliverable artifacts differ from the committed ones" >&2
            exit 1
          fi
          if ! git diff --quiet -- modules/; then
            echo "note: auxiliary .aot differs from the committed copy (advisory; meta.json hash stands):"
            git diff --stat -- modules/
          fi
          echo "build: deliverable outputs are byte-identical to the committed ones"

      - uses: actions/upload-artifact@v4
        with:
          name: module-artifacts
          path: modules/

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    needs: build   # restores the wamrc cache the build job just saved
    steps:
      - uses: actions/checkout@v4

      - name: wasi-sdk 24.0 (download, verify, extract)
        run: |
          mkdir -p "$TOOLCHAIN_ROOT"
          curl -fsSL "$WASI_SDK_URL" -o "$TOOLCHAIN_ROOT/wasi-sdk.tar.gz"
          echo "$WASI_SDK_SHA256  $TOOLCHAIN_ROOT/wasi-sdk.tar.gz" | sha256sum -c -
          tar -xzf "$TOOLCHAIN_ROOT/wasi-sdk.tar.gz" -C "$TOOLCHAIN_ROOT"
          test -x "$TOOLCHAIN_ROOT/wasi-sdk-24.0-x86_64-linux/bin/clang"

      - name: wamrc binary (cache)
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN_ROOT }}/wamrc-install
          key: wamrc-WAMR-2.4.0-xtensa-18.1.2-v2

      - name: rebuild from scratch and compare hashes vs index.json / meta.json
        run: |
          export WASI_SDK="$TOOLCHAIN_ROOT/wasi-sdk-24.0-x86_64-linux"
          export WAMRC="$TOOLCHAIN_ROOT/wamrc-install/wamrc"
          ./build.sh --check

      - name: download the build job's artifacts
        uses: actions/download-artifact@v4
        with:
          name: module-artifacts
          path: artifacts-from-build

      - name: independent rebuild must equal the build job's artifacts
        run: |
          export WASI_SDK="$TOOLCHAIN_ROOT/wasi-sdk-24.0-x86_64-linux"
          export WAMRC="$TOOLCHAIN_ROOT/wamrc-install/wamrc"
          ./build.sh >/dev/null   # same inputs, an independent second build
          diff -r modules artifacts-from-build
          echo "verify: intra-CI rebuilds are byte-identical"

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: compile and run every native module test (stub host)
        run: |
          set -eux
          found=0
          for t in src/*/test_*.c; do
            name=$(basename "$t" .c)
            gcc -DXUANSI_NATIVE_TEST -Wall -Wextra -Werror \
              -I "src/$(basename "$(dirname "$t")")" -I src \
              "$t" -o "/tmp/$name"
            "/tmp/$name"
            found=1
          done
          test "$found" -eq 1
